<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hər Gün Sənə Doğru ✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-night-1: #090d1c;
      --bg-night-2: #141730;
      --bg-night-3: #231428;
      --card-glass: rgba(255, 248, 252, 0.055);
      --card-border: rgba(235, 215, 245, 0.16);
      --card-open: linear-gradient(145deg, rgba(255, 175, 200, 0.16), rgba(246, 208, 162, 0.11));
      --card-open-border: rgba(255, 198, 218, 0.45);
      --text-main: #fdf7fb;
      --text-muted: rgba(242, 228, 240, 0.72);
      --rose: #ffb3c9;
      --champagne: #f6d5a8;
      --ice-blue: #cde4ff;
      --modal-bg: #131224;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(ellipse at 20% 10%, rgba(124, 156, 255, 0.2), transparent 46%),
        radial-gradient(ellipse at 82% 18%, rgba(235, 128, 168, 0.22), transparent 45%),
        radial-gradient(ellipse at 50% 95%, rgba(246, 213, 168, 0.12), transparent 50%),
        linear-gradient(170deg, var(--bg-night-1) 0%, var(--bg-night-2) 52%, var(--bg-night-3) 100%);
      padding: 34px 16px 76px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Winter Aurora Shimmer */
    body::before {
      content: "";
      position: fixed;
      inset: -20%;
      background:
        radial-gradient(circle at 30% 25%, rgba(255, 179, 201, 0.08), transparent 40%),
        radial-gradient(circle at 72% 60%, rgba(168, 208, 255, 0.08), transparent 42%);
      animation: auroraDrift 14s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes auroraDrift {
      0% {
        transform: translate(-2%, -1%) scale(1);
      }
      100% {
        transform: translate(2%, 2%) scale(1.06);
      }
    }

    /* Snowfall & Twinkling Stars Layer */
    .winter-sky {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .snowflake {
      position: absolute;
      top: -24px;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 0 8px rgba(205, 228, 255, 0.65);
      user-select: none;
      animation: snowFall linear infinite;
    }

    @keyframes snowFall {
      0% {
        transform: translateY(-10px) translateX(0) rotate(0deg);
        opacity: 0;
      }
      12% {
        opacity: var(--snow-opacity, 0.7);
      }
      88% {
        opacity: var(--snow-opacity, 0.7);
      }
      100% {
        transform: translateY(105vh) translateX(var(--sway, 35px)) rotate(360deg);
        opacity: 0;
      }
    }

    .star-spark {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px 1px rgba(246, 213, 168, 0.85);
      animation: starTwinkle ease-in-out infinite;
    }

    @keyframes starTwinkle {
      0%, 100% {
        opacity: 0.15;
        transform: scale(0.7);
      }
      50% {
        opacity: 0.95;
        transform: scale(1.3);
      }
    }

    .container {
      position: relative;
      z-index: 3;
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 34px;
      animation: headerFadeIn 0.9s ease-out;
    }

    @keyframes headerFadeIn {
      0% {
        opacity: 0;
        transform: translateY(-12px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.76rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--champagne);
      background: rgba(246, 213, 168, 0.09);
      border: 1px solid rgba(246, 213, 168, 0.28);
      box-shadow: 0 4px 20px rgba(246, 213, 168, 0.08);
      padding: 7px 16px;
      border-radius: 999px;
      margin-bottom: 14px;
      backdrop-filter: blur(8px);
    }

    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(2.35rem, 5.5vw, 3.6rem);
      font-weight: 600;
      line-height: 1.1;
      margin-bottom: 12px;
      background: linear-gradient(120deg, #ffffff 15%, #ffd9e6 55%, #f6d5a8 95%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 30px rgba(255, 179, 201, 0.16);
    }

    .subtitle {
      max-width: 550px;
      margin: 0 auto 20px;
      font-size: 0.96rem;
      line-height: 1.65;
      color: var(--text-muted);
    }

    .status-bar {
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      font-size: 0.84rem;
      color: var(--text-muted);
    }

    .pill {
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(235, 215, 245, 0.18);
      padding: 8px 16px;
      border-radius: 999px;
      backdrop-filter: blur(10px);
    }

    .pill strong {
      color: var(--rose);
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(142px, 1fr));
      gap: 14px;
    }

    @media (max-width: 480px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 11px;
      }
    }

    .day-card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 128px;
      padding: 15px;
      border-radius: 20px;
      border: 1px solid var(--card-border);
      background: var(--card-glass);
      color: var(--text-main);
      text-align: left;
      cursor: pointer;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.28s ease, box-shadow 0.28s ease, background 0.28s ease;
      backdrop-filter: blur(12px);
      overflow: hidden;
    }

    /* Subtle frosted top shine on cards */
    .day-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, transparent 45%);
      opacity: 0.55;
      pointer-events: none;
    }

    .day-card:hover:not(.locked) {
      transform: translateY(-5px) scale(1.015);
      border-color: rgba(255, 198, 218, 0.58);
      box-shadow: 0 14px 30px rgba(255, 145, 185, 0.18), inset 0 0 16px rgba(255, 210, 228, 0.08);
    }

    .day-card.opened {
      background: var(--card-open);
      border-color: var(--card-open-border);
    }

    .day-card.today:not(.locked) {
      border-color: rgba(255, 179, 201, 0.72);
      animation: todayBreath 3.2s ease-in-out infinite;
    }

    @keyframes todayBreath {
      0%, 100% {
        box-shadow: 0 0 0 1px rgba(255, 179, 201, 0.38), 0 10px 26px rgba(255, 140, 180, 0.2);
      }
      50% {
        box-shadow: 0 0 0 2px rgba(246, 213, 168, 0.55), 0 14px 36px rgba(255, 140, 180, 0.36);
      }
    }

    .day-card.locked {
      opacity: 0.44;
      cursor: not-allowed;
    }

    .day-card.secret-reveal {
      background: linear-gradient(145deg, rgba(255, 168, 198, 0.24), rgba(246, 213, 168, 0.2));
      border-color: rgba(246, 213, 168, 0.65);
      box-shadow: 0 0 32px rgba(255, 155, 190, 0.28);
      animation: secretAppear 0.75s cubic-bezier(0.22, 1.25, 0.36, 1);
    }

    @keyframes secretAppear {
      0% {
        opacity: 0;
        transform: scale(0.75) translateY(16px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 0.74rem;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .day-card.today:not(.locked) .card-top span:first-child {
      color: var(--rose);
      font-weight: 600;
    }

    .gift-icon {
      font-size: 1.18rem;
      line-height: 1;
      transition: transform 0.25s ease;
    }

    .day-card:hover:not(.locked) .gift-icon {
      transform: scale(1.18) rotate(6deg);
    }

    .day-num {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.9rem;
      font-weight: 600;
      line-height: 1.05;
      margin: 7px 0 2px;
    }

    .day-month {
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--champagne);
    }

    .card-footer {
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-top: 9px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .day-card.opened .card-footer {
      color: var(--rose);
    }

    /* Romantic Love-Letter Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(6, 8, 18, 0.8);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal {
      position: relative;
      width: 100%;
      max-width: 490px;
      background:
        radial-gradient(circle at top right, rgba(255, 179, 201, 0.14), transparent 50%),
        radial-gradient(circle at bottom left, rgba(168, 208, 255, 0.1), transparent 50%),
        var(--modal-bg);
      border: 1px solid rgba(255, 205, 224, 0.28);
      border-radius: 26px;
      padding: 30px 26px 28px;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.65), 0 0 40px rgba(255, 165, 198, 0.12);
      overflow: hidden;
    }

    .modal.gift-pop {
      animation: giftPop 0.55s cubic-bezier(0.22, 1.25, 0.36, 1);
    }

    .modal.jan1-mode {
      background: linear-gradient(160deg, #281326, #141126 58%, #291a20);
      border-color: rgba(246, 213, 168, 0.55);
      box-shadow: 0 28px 80px rgba(255, 140, 180, 0.32);
    }

    .bg-year-2027 {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(5.5rem, 22vw, 8.8rem);
      font-weight: 600;
      letter-spacing: 0.06em;
      color: rgba(255, 185, 205, 0.09);
      user-select: none;
      pointer-events: none;
      z-index: 0;
      animation: yearPulse 4s ease-in-out infinite;
    }

    .modal.jan1-mode .bg-year-2027 {
      display: flex;
    }

    @keyframes yearPulse {
      0%, 100% {
        transform: scale(0.98);
        color: rgba(255, 185, 205, 0.08);
      }
      50% {
        transform: scale(1.03);
        color: rgba(246, 213, 168, 0.15);
      }
    }

    .modal > *:not(.bg-year-2027) {
      position: relative;
      z-index: 2;
    }

    @keyframes giftPop {
      0% {
        opacity: 0;
        transform: scale(0.86) translateY(16px) rotate(-1.2deg);
      }
      55% {
        transform: scale(1.02) translateY(-2px) rotate(0.6deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0) rotate(0deg);
      }
    }

    .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
      z-index: 6 !important;
    }

    .close-btn:hover {
      background: rgba(255, 179, 201, 0.2);
      transform: rotate(90deg);
    }

    .modal-date {
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--champagne);
      margin-bottom: 6px;
    }

    .modal-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.98rem;
      font-weight: 600;
      line-height: 1.15;
      margin-bottom: 14px;
      padding-right: 34px;
      color: #fff;
    }

    .modal-text {
      font-size: 1rem;
      line-height: 1.78;
      color: rgba(253, 245, 250, 0.94);
      margin-bottom: 18px;
      white-space: pre-line;
    }

    .modal.jan1-mode .modal-text {
      font-size: 1.07rem;
    }

    .audio-box {
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(255, 205, 224, 0.22);
      border-radius: 18px;
      padding: 12px 14px;
    }

    .audio-label {
      font-size: 0.78rem;
      color: var(--rose);
      margin-bottom: 8px;
    }

    audio {
      width: 100%;
      height: 38px;
    }

    /* Floating hearts from gift box */
    .heart-burst-layer {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 150;
      overflow: hidden;
    }

    .floating-heart {
      position: absolute;
      font-size: 1.3rem;
      opacity: 0;
      animation: floatUpHeart 1.75s ease-out forwards;
    }

    .floating-heart.romantic-big {
      font-size: 1.8rem;
      animation: floatUpRomantic 2.7s ease-out forwards;
    }

    @keyframes floatUpHeart {
      0% {
        opacity: 0;
        transform: translate(0, 0) scale(0.45) rotate(0deg);
      }
      18% {
        opacity: 1;
        transform: translate(calc(var(--dx) * 0.25), -26px) scale(1.15) rotate(var(--rot));
      }
      100% {
        opacity: 0;
        transform: translate(var(--dx), -160px) scale(0.85) rotate(calc(var(--rot) * 1.6));
      }
    }

    @keyframes floatUpRomantic {
      0% {
        opacity: 0;
        transform: translate(0, 20px) scale(0.4) rotate(0deg);
      }
      16% {
        opacity: 1;
        transform: translate(calc(var(--dx) * 0.25), -35px) scale(1.22) rotate(var(--rot));
      }
      70% {
        opacity: 0.92;
      }
      100% {
        opacity: 0;
        transform: translate(var(--dx), -250px) scale(0.95) rotate(calc(var(--rot) * 1.8));
      }
    }
  </style>
</head>
<body>
  <div class="winter-sky" id="winterSky" aria-hidden="true"></div>
  <div class="heart-burst-layer" id="heartLayer"></div>

  <div class="container">
    <header>
      <div class="eyebrow">❄️ 24 NOYABR — 31 DEKABR ❄️</div>
      <h1>Hər Gün Sənə Doğru ✨</h1>
      <p class="subtitle">Qışın soyuğunda ürəyini isidəcək balaca xatirələr. Bəzi şeylər sözə ehtiyac duymur, bəziləri isə bircə cümlə ilə yerinə düşür.</p>
      <div class="status-bar">
        <div class="pill">Açılan: <strong id="openedCount">0</strong> / <strong id="totalCount">38</strong></div>
        <div class="pill" id="todayInfo">Bu gün: —</div>
      </div>
    </header>

    <main class="grid" id="calendarGrid"></main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true">
    <div class="modal" id="modalBox">
      <div class="bg-year-2027" aria-hidden="true">2027</div>
      <button class="close-btn" id="closeModal" aria-label="Bağla">×</button>
      <div class="modal-date" id="modalDate"></div>
      <h2 class="modal-title" id="modalTitle"></h2>
      <p class="modal-text" id="modalText"></p>
      <div class="audio-box" id="audioBox" style="display: none;">
        <div class="audio-label" id="audioLabel">Bu günün fon musiqisi 🎶</div>
        <audio id="audioPlayer" controls preload="metadata"></audio>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_SONG = "song.mp3";

    const ENTRIES = [
      { id: "nov-24", day: 24, month: "Noyabr", year: 2026, title: "İlk qutu açıldı 🤍", song: DEFAULT_SONG,
        text: "Hə, bax başlandı. Heç nəyi böyütmürəm, sadəcə 38 gün hər gün bura kiçik bir şey qoyacam. Ümid edirəm açanda üzündə balaca da olsa bir gülüş olar." },
      { id: "nov-25", day: 25, month: "Noyabr", year: 2026, title: "Sakit not", song: null,
        text: "Bu gün mahnı qoymadım. Bəzən səs olmayanda sözlər daha yaxşı eşidilir. Özündən muğayat ol, soyuqda çox qalma." },
      { id: "nov-26", day: 26, month: "Noyabr", year: 2026, title: "Kofe bəhanəsi ☕", song: DEFAULT_SONG,
        text: "Hava soyuqlaşanda kofe içməyin həmişə bir bəhanəsi tapılır. Bunu say kiçik kupon kimi: istədiyin vaxt bir kofe borcum olsun." },
      { id: "nov-27", day: 27, month: "Noyabr", year: 2026, title: "Axşamüstü", song: "song1.mp3",
        text: "Gün boyu o qədər boş-boş iş olur ki, axşam iki kəlmə normal danışmaq adamı xeyli yüngülləşdirir." },
      { id: "nov-28", day: 28, month: "Noyabr", year: 2026, title: "Kiçik sual 🤔", song: DEFAULT_SONG,
        text: "İndi sənə bir sual: bu gün kiminləsə danışmasaydın, günün nəyi əskik qalardı? Cavab verməsən də olar, özündə saxla." },
      { id: "nov-29", day: 29, month: "Noyabr", year: 2026, title: "Təbii hal", song: null,
        text: "Səndə ən xoşuma gələn şey o rahat, özün kimi olmağındır. Heç nəyi oynamırmış kimi görünürsən, o da adama yaxşı təsir edir." },
      { id: "nov-30", day: 30, month: "Noyabr", year: 2026, title: "Noyabrın sonu", song: DEFAULT_SONG,
        text: "Noyabr da belə getdi. Sabahdan dekabr başlayır — ilin ən səs-küylü, bir az da şirin ayı." },

      { id: "dec-1", day: 1, month: "Dekabr", year: 2026, title: "Dekabr gəldi ✨", song: DEFAULT_SONG,
        text: "Xoş gəldin dekabr. İşıqlar, soyuq külək, isti çay... Bu ay sənə düşərli gəlsin, planladığın işlər rahat getsin." },
      { id: "dec-2", day: 2, month: "Dekabr", year: 2026, title: "Bir az zarafat 😌", song: null,
        text: "Bu gün özünü yormaq yoxdur. Əgər kimsə əsəblərini korlasa, de ki «vaxtim yoxdur» — ən yaxşı taktika budur." },
      { id: "dec-3", day: 3, month: "Dekabr", year: 2026, title: "Film seçimi 🎬", song: DEFAULT_SONG,
        text: "Kiçik kupon: növbəti dəfə baxmağa bir şey tapsaq, seçimi tam sənə verirəm. Zövqünə güvənirəm." },
      { id: "dec-4", day: 4, month: "Dekabr", year: 2026, title: "Dərin nəfəs", song: null,
        text: "Bəzən insan heç nə etmədən də yorulur. Bu gün özünə bir az vaxt ayır, telefonu bir kənara qoy." },
      { id: "dec-5", day: 5, month: "Dekabr", year: 2026, title: "Soyuq hava 🧣", song: DEFAULT_SONG,
        text: "Qalın geyin, sonra «üşüdüm» deyib şikayət eləmə. Bu xəbərdarlıq idi." },
      { id: "dec-6", day: 6, month: "Dekabr", year: 2026, title: "Uğur olsun", song: null,
        text: "Bu gün əlinə aldığın iş yarımçıq qalmasın. Hər şey istədiyin kimi alınsın." },
      { id: "dec-7", day: 7, month: "Dekabr", year: 2026, title: "Bir kadr 📸", song: DEFAULT_SONG,
        text: "Bu gün qarşına çıxan ən adi, amma xoşuna gələn bir şeyi çək saxla. Mənə atsan da olar, atmasan da." },
      { id: "dec-8", day: 8, month: "Dekabr", year: 2026, title: "Gülüş", song: null,
        text: "Sənin o səmimi gülüşün adamın gününü xeyli yumşaldır. Bunu tez-tez elə, yaraşır." },
      { id: "dec-9", day: 9, month: "Dekabr", year: 2026, title: "Şirniyyat kuponu 🍰", song: DEFAULT_SONG,
        text: "Bu da ikinci kupon: hansı şirniyyatı sevirsənsə, vaxtını sən seçirsən, qalanı məndən." },
      { id: "dec-10", day: 10, month: "Dekabr", year: 2026, title: "İlk ongünlük", song: null,
        text: "Dekabrın ilk 10 günü bitdi. Göz açıb yumunca ayın yarısına çatacağıq." },
      { id: "dec-11", day: 11, month: "Dekabr", year: 2026, title: "Özünə inan", song: DEFAULT_SONG,
        text: "Bəzən özünü qiymətləndirməyi unudursan, amma kənardan baxanda hər şey aydın görünür. Bacarırsan." },
      { id: "dec-12", day: 12, month: "Dekabr", year: 2026, title: "Sadəcə belə 🤍", song: null,
        text: "Heç bir xüsusi səbəb yoxdur. Sadəcə yaxşı ki varsan, bu təqvim də onun kiçik bəhanəsidir." },
      { id: "dec-13", day: 13, month: "Dekabr", year: 2026, title: "13 rəqəmi 🍀", song: DEFAULT_SONG,
        text: "Kim nə deyir desin, 13 pis rəqəm deyil. Bu gün sənin üçün yaxşı keçsin." },
      { id: "dec-14", day: 14, month: "Dekabr", year: 2026, title: "Gəzinti kuponu 🚶‍♀️", song: null,
        text: "Kupon: tələsmədən, ayaqlar yorulana qədər gəzmək və hər mövzudan danışmaq. Vaxtını özün deyərsən." },
      { id: "dec-15", day: 15, month: "Dekabr", year: 2026, title: "Ayın yarısı", song: DEFAULT_SONG,
        text: "Dekabrın ortası! Artıq hər yerdə Yeni il havası var, sənin də əhvalın yüngül olsun." },
      { id: "dec-16", day: 16, month: "Dekabr", year: 2026, title: "Uzaqdan təsir", song: null,
        text: "Maraqlıdır, bəzi adamlarla danışanda adamın özündə də bir sakitlik yaranır. Sən də eləsən." },
      { id: "dec-17", day: 17, month: "Dekabr", year: 2026, title: "Yavaşla", song: DEFAULT_SONG,
        text: "Hər şeyi eyni anda çatdırmağa çalışma. Bu axşam bir az yavaşla." },
      { id: "dec-18", day: 18, month: "Dekabr", year: 2026, title: "Detallar", song: null,
        text: "Səndəki o kiçik detallara fikir vermək, səliqə və zövq — həqiqətən fərqli görünür." },
      { id: "dec-19", day: 19, month: "Dekabr", year: 2026, title: "Əsl hədiyyə 🎁", song: DEFAULT_SONG,
        text: "Ən yaxşı şey qutuda olan deyil, vaxt ayırılıb düşünülmüş olandır. Ona görə bu təqvimi elə belə yığdım." },
      { id: "dec-20", day: 20, month: "Dekabr", year: 2026, title: "Qış havası ❄️", song: null,
        text: "İçəridə isti, çöldə soyuq — bu havanın özünəməxsus bir rahatlığı var." },
      { id: "dec-21", day: 21, month: "Dekabr", year: 2026, title: "Ən uzun gecə", song: DEFAULT_SONG,
        text: "Bu gecə ilin ən uzun gecəsidir. Amma bundan sonra günlər yavaş-yavaş uzanacaq." },
      { id: "dec-22", day: 22, month: "Dekabr", year: 2026, title: "Son 9 gün", song: null,
        text: "İlin bitməyinə az qalıb. Bu il səni tanımaq mənim üçün yaxşı xatirə oldu." },
      { id: "dec-23", day: 23, month: "Dekabr", year: 2026, title: "Vaxt necə keçir", song: DEFAULT_SONG,
        text: "Səninlə danışanda vaxtın necə gəlib keçdiyini çox vaxt hiss etmirəm." },
      { id: "dec-24", day: 24, month: "Dekabr", year: 2026, title: "Düz bir ay 🤍", song: null,
        text: "İlk qutunu açdığımızdan düz bir ay keçdi. Ürəyindən keçən yaxşı şeylər tezliklə olsun." },
      { id: "dec-25", day: 25, month: "Dekabr", year: 2026, title: "İşıqlar ✨", song: DEFAULT_SONG,
        text: "Şəhərin işıqları yandıqca əhval da dəyişir. Bu gün sənin günün olsun." },
      { id: "dec-26", day: 26, month: "Dekabr", year: 2026, title: "Son 5 gün", song: null,
        text: "Bu ilin ağırlığını özünlə gələn ilə aparma. Yüngül gir yeni ilə." },
      { id: "dec-27", day: 27, month: "Dekabr", year: 2026, title: "Bir arzu 🌙", song: DEFAULT_SONG,
        text: "Gələn ildən ən çox nə istəyirsən? Ağlında birini tut, qoy öz vaxtında gəlsin." },
      { id: "dec-28", day: 28, month: "Dekabr", year: 2026, title: "Geri sayım", song: null,
        text: "İlin son günləridir. Hər günün kiçik bir dadını çıxarmağa çalış." },
      { id: "dec-29", day: 29, month: "Dekabr", year: 2026, title: "Son 2 gün", song: DEFAULT_SONG,
        text: "Bu il sənə nə verdi, nəyi öyrətdi — bircə dəqiqə düşün, yaxşılarını yadda saxla." },
      { id: "dec-30", day: 30, month: "Dekabr", year: 2026, title: "Sabaha qədər", song: null,
        text: "38 günün sonuna cəmi bir gün qaldı. Sabah yekunlaşdırırıq." },
      { id: "dec-31", day: 31, month: "Dekabr", year: 2026, title: "Yeni ilin mübarək! 🥂", song: DEFAULT_SONG,
        text: "38 gün belə bitdi. Yeni il sənə can sağlığı, bol-bol rahatlıq, gülməli anlar və ürəyindən keçən hər şeyin ən yaxşısını gətirsin! ✨" }
    ];

    const SECRET_JAN_1 = {
      id: "jan-1-2027",
      day: 1,
      month: "Yanvar",
      year: 2027,
      isSecretJan1: true,
      title: "2027 — Səninlə 🤍",
      song: DEFAULT_SONG,
      text: "Hərkəs yeni ilə, sən illərimə.\n\nBu vaxta qədər özümü saxladığım nə varsa, bax burda açılır: sən mənim üçün sadəcə bir günün, bir ayın ya da bir ilin adamı deyilsən. Yeni il xoş gəlsin, amma ən gözəli sənin olduğun hər gün olsun."
    };

    const STORAGE_KEY = "advent_38_opened_v4";
    const winterSkyEl = document.getElementById("winterSky");
    const gridEl = document.getElementById("calendarGrid");
    const openedCountEl = document.getElementById("openedCount");
    const totalCountEl = document.getElementById("totalCount");
    const todayInfoEl = document.getElementById("todayInfo");
    const modalBackdrop = document.getElementById("modalBackdrop");
    const modalBox = document.getElementById("modalBox");
    const closeModalBtn = document.getElementById("closeModal");
    const modalDateEl = document.getElementById("modalDate");
    const modalTitleEl = document.getElementById("modalTitle");
    const modalTextEl = document.getElementById("modalText");
    const audioBoxEl = document.getElementById("audioBox");
    const audioPlayerEl = document.getElementById("audioPlayer");
    const heartLayerEl = document.getElementById("heartLayer");

    /* Generate gentle winter snowfall & twinkling stars */
    function initWinterSky() {
      const flakes = ["❄", "❅", "❆", "•"];
      for (let i = 0; i < 36; i++) {
        const flake = document.createElement("span");
        flake.className = "snowflake";
        flake.textContent = flakes[i % flakes.length];
        const size = 9 + Math.random() * 12;
        const left = Math.random() * 100;
        const duration = 10 + Math.random() * 14;
        const delay = -Math.random() * 20;
        const sway = (Math.random() - 0.5) * 90;
        const opacity = 0.25 + Math.random() * 0.55;

        flake.style.fontSize = `${size}px`;
        flake.style.left = `${left}%`;
        flake.style.animationDuration = `${duration}s`;
        flake.style.animationDelay = `${delay}s`;
        flake.style.setProperty("--sway", `${sway}px`);
        flake.style.setProperty("--snow-opacity", opacity.toFixed(2));
        winterSkyEl.appendChild(flake);
      }

      for (let i = 0; i < 24; i++) {
        const star = document.createElement("span");
        star.className = "star-spark";
        star.style.left = `${Math.random() * 100}%`;
        star.style.top = `${Math.random() * 65}%`;
        star.style.animationDuration = `${2.5 + Math.random() * 3.5}s`;
        star.style.animationDelay = `${Math.random() * 4}s`;
        winterSkyEl.appendChild(star);
      }
    }

    function getOpenedSet() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return new Set(raw ? JSON.parse(raw) : []);
      } catch {
        return new Set();
      }
    }

    function saveOpenedSet(set) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...set]));
      } catch {}
    }

    function getEntryDate(entry) {
      const monthIdx = entry.month === "Noyabr" ? 10 : (entry.month === "Dekabr" ? 11 : 0);
      return new Date(entry.year, monthIdx, entry.day, 0, 0, 0, 0);
    }

    function getTodayStart() {
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0);
    }

    function isUnlocked(entry, todayStart) {
      if (entry.isSecretJan1) {
        return getOpenedSet().has("dec-31") && getEntryDate(entry) <= todayStart;
      }
      return getEntryDate(entry) <= todayStart;
    }

    function isToday(entry, todayStart) {
      return getEntryDate(entry).getTime() === todayStart.getTime();
    }

    function spawnHearts(isRomanticFinal = false) {
      const hearts = isRomanticFinal
        ? ["🤍", "❤️", "💖", "✨", "💕", "❄️"]
        : ["🤍", "♥", "✨", "❄️"];
      const count = isRomanticFinal ? 28 : 12;

      for (let i = 0; i < count; i++) {
        const el = document.createElement("span");
        el.className = isRomanticFinal ? "floating-heart romantic-big" : "floating-heart";
        el.textContent = hearts[i % hearts.length];
        const left = 14 + Math.random() * 72;
        const top = 42 + Math.random() * 34;
        const dx = (Math.random() - 0.5) * (isRomanticFinal ? 240 : 150);
        const rot = (Math.random() - 0.5) * 48;
        el.style.left = `${left}%`;
        el.style.top = `${top}%`;
        el.style.setProperty("--dx", `${dx}px`);
        el.style.setProperty("--rot", `${rot}deg`);
        el.style.animationDelay = `${i * (isRomanticFinal ? 0.06 : 0.05)}s`;
        heartLayerEl.appendChild(el);
        setTimeout(() => el.remove(), isRomanticFinal ? 2800 : 1800);
      }
    }

    let romanticLoopTimer = null;

    function startRomanticShower() {
      stopRomanticShower();
      spawnHearts(true);
      romanticLoopTimer = setInterval(() => {
        if (!modalBackdrop.classList.contains("active") || !modalBox.classList.contains("jan1-mode")) {
          stopRomanticShower();
          return;
        }
        spawnHearts(true);
      }, 1500);
    }

    function stopRomanticShower() {
      if (romanticLoopTimer) {
        clearInterval(romanticLoopTimer);
        romanticLoopTimer = null;
      }
    }

    function openEntry(entry, openedSet) {
      const isNewOpen = !openedSet.has(entry.id);
      openedSet.add(entry.id);
      saveOpenedSet(openedSet);

      modalDateEl.textContent = `${entry.day} ${entry.month} ${entry.year}`;
      modalTitleEl.textContent = entry.title;
      modalTextEl.textContent = entry.text;

      if (entry.isSecretJan1) {
        modalBox.classList.add("jan1-mode");
        startRomanticShower();
      } else {
        modalBox.classList.remove("jan1-mode");
        stopRomanticShower();
        spawnHearts(false);
      }

      if (entry.song) {
        audioBoxEl.style.display = "block";
        if (audioPlayerEl.getAttribute("src") !== entry.song) {
          audioPlayerEl.src = entry.song;
        }
        audioPlayerEl.currentTime = 0;
      } else {
        audioPlayerEl.pause();
        audioPlayerEl.removeAttribute("src");
        audioBoxEl.style.display = "none";
      }

      modalBox.classList.remove("gift-pop");
      void modalBox.offsetWidth;
      modalBox.classList.add("gift-pop");
      modalBackdrop.classList.add("active");

      if (isNewOpen || entry.id === "dec-31") {
        renderGrid();
      }
    }

    function closeModal() {
      stopRomanticShower();
      modalBox.classList.remove("jan1-mode");
      modalBackdrop.classList.remove("active");
      audioPlayerEl.pause();
      audioPlayerEl.currentTime = 0;
    }

    function renderGrid() {
      const openedSet = getOpenedSet();
      const todayStart = getTodayStart();
      gridEl.innerHTML = "";

      const now = new Date();
      const monthNames = ["Yanvar","Fevral","Mart","Aprel","May","İyun","İyul","Avqust","Sentyabr","Oktyabr","Noyabr","Dekabr"];
      todayInfoEl.textContent = `Bu gün: ${now.getDate()} ${monthNames[now.getMonth()]}`;

      const showSecretJan1 = openedSet.has("dec-31");
      const visibleEntries = showSecretJan1 ? [...ENTRIES, SECRET_JAN_1] : ENTRIES;
      totalCountEl.textContent = showSecretJan1 ? "39" : "38";

      let unlockedOpenedCount = 0;
      visibleEntries.forEach((entry) => {
        if (openedSet.has(entry.id) && isUnlocked(entry, todayStart)) {
          unlockedOpenedCount++;
        }
      });
      openedCountEl.textContent = unlockedOpenedCount;

      visibleEntries.forEach((entry) => {
        const unlocked = isUnlocked(entry, todayStart);
        const today = isToday(entry, todayStart);
        const opened = openedSet.has(entry.id) && unlocked;

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "day-card";
        if (!unlocked) btn.classList.add("locked");
        if (opened) btn.classList.add("opened");
        if (today) btn.classList.add("today");
        if (entry.isSecretJan1) btn.classList.add("secret-reveal");

        const icon = !unlocked ? "🔒" : (entry.isSecretJan1 ? "🥂" : (opened ? "💌" : "🎁"));
        const badgeText = entry.isSecretJan1 ? "SÜRPRİZ" : (today ? "BU GÜN" : entry.month.slice(0, 3).toUpperCase());
        const statusText = !unlocked
          ? `${entry.day} ${entry.month}`
          : (entry.isSecretJan1 ? (opened ? "Açıldı 🤍" : "Gizli qutu") : (opened ? "Oxundu 🤍" : (today ? "Bu günün məktubu" : "Açılmayıb")));

        btn.innerHTML = `
          <div class="card-top">
            <span>${badgeText}</span>
            <span class="gift-icon">${icon}</span>
          </div>
          <div>
            <div class="day-num">${entry.day}</div>
            <div class="day-month">${entry.month} ${entry.isSecretJan1 ? "2027" : ""}</div>
          </div>
          <div class="card-footer">${statusText}</div>
        `;

        if (unlocked) {
          btn.addEventListener("click", () => openEntry(entry, openedSet));
        } else {
          btn.disabled = true;
        }

        gridEl.appendChild(btn);
      });
    }

    closeModalBtn.addEventListener("click", closeModal);
    modalBackdrop.addEventListener("click", (e) => {
      if (e.target === modalBackdrop) closeModal();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && modalBackdrop.classList.contains("active")) {
        closeModal();
      }
    });

    initWinterSky();
    renderGrid();

    setInterval(() => {
      renderGrid();
    }, 30000);
  </script>
</body>
</html>
