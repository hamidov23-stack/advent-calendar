<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>24 Noyabr — 31 Dekabr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-1: #160c10;
      --bg-2: #241118;
      --card-bg: rgba(255, 245, 247, 0.055);
      --card-border: rgba(255, 214, 224, 0.16);
      --card-open: rgba(255, 182, 198, 0.12);
      --card-open-border: rgba(255, 190, 205, 0.36);
      --text-main: #fff5f7;
      --text-muted: rgba(255, 232, 237, 0.72);
      --accent: #ff9eb5;
      --accent-soft: rgba(255, 158, 181, 0.18);
      --gold: #f5cfa0;
      --modal-bg: #1e1016;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at 18% 12%, rgba(185, 68, 102, 0.24), transparent 45%),
        radial-gradient(circle at 82% 20%, rgba(214, 145, 92, 0.14), transparent 42%),
        linear-gradient(165deg, var(--bg-1), var(--bg-2));
      padding: 28px 16px 64px;
      overflow-x: hidden;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    .eyebrow {
      display: inline-block;
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(245, 207, 160, 0.1);
      border: 1px solid rgba(245, 207, 160, 0.25);
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(2.1rem, 5vw, 3.2rem);
      font-weight: 600;
      line-height: 1.12;
      margin-bottom: 10px;
    }

    .subtitle {
      max-width: 560px;
      margin: 0 auto 18px;
      font-size: 0.96rem;
      line-height: 1.6;
      color: var(--text-muted);
    }

    .status-bar {
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      font-size: 0.84rem;
      color: var(--text-muted);
    }

    .pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 7px 14px;
      border-radius: 999px;
    }

    .pill strong {
      color: var(--accent);
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(136px, 1fr));
      gap: 12px;
    }

    @media (max-width: 480px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
    }

    .day-card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 118px;
      padding: 14px;
      border-radius: 18px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-main);
      text-align: left;
      cursor: pointer;
      transition: transform 0.22s ease, border-color 0.22s ease, background 0.22s ease, box-shadow 0.22s ease;
      backdrop-filter: blur(8px);
    }

    .day-card:hover:not(.locked) {
      transform: translateY(-3px);
      border-color: var(--card-open-border);
      background: var(--card-open);
    }

    .day-card.opened {
      background: var(--card-open);
      border-color: var(--card-open-border);
    }

    .day-card.today:not(.locked) {
      box-shadow: 0 0 0 1px rgba(255, 158, 181, 0.4), 0 10px 24px rgba(255, 120, 155, 0.14);
    }

    .day-card.locked {
      opacity: 0.48;
      cursor: not-allowed;
    }

    .day-card.secret-reveal {
      background: linear-gradient(145deg, rgba(255, 158, 181, 0.2), rgba(245, 207, 160, 0.16));
      border-color: rgba(245, 207, 160, 0.55);
      box-shadow: 0 0 28px rgba(255, 145, 175, 0.22);
      animation: secretAppear 0.7s cubic-bezier(0.22, 1.25, 0.36, 1);
    }

    @keyframes secretAppear {
      0% {
        opacity: 0;
        transform: scale(0.75) translateY(14px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .gift-icon {
      font-size: 1.15rem;
      line-height: 1;
    }

    .day-num {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.75rem;
      font-weight: 600;
      line-height: 1.1;
      margin: 6px 0 2px;
    }

    .day-month {
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .card-footer {
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-top: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .day-card.opened .card-footer {
      color: var(--accent);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(9, 4, 7, 0.78);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal {
      position: relative;
      width: 100%;
      max-width: 480px;
      background: var(--modal-bg);
      border: 1px solid rgba(255, 196, 210, 0.24);
      border-radius: 24px;
      padding: 28px 24px 26px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      overflow: hidden;
    }

    .modal.gift-pop {
      animation: giftPop 0.52s cubic-bezier(0.22, 1.25, 0.36, 1);
    }

    .modal.jan1-mode {
      background: linear-gradient(160deg, #2b111b, #1b0c14 60%, #2a1816);
      border-color: rgba(245, 207, 160, 0.48);
      box-shadow: 0 28px 75px rgba(255, 120, 160, 0.25);
    }

    .bg-year-2027 {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(5.5rem, 22vw, 8.8rem);
      font-weight: 600;
      letter-spacing: 0.06em;
      color: rgba(255, 185, 205, 0.085);
      user-select: none;
      pointer-events: none;
      z-index: 0;
      animation: yearPulse 4s ease-in-out infinite;
    }

    .modal.jan1-mode .bg-year-2027 {
      display: flex;
    }

    @keyframes yearPulse {
      0%, 100% {
        transform: scale(0.98);
        color: rgba(255, 185, 205, 0.075);
      }
      50% {
        transform: scale(1.03);
        color: rgba(245, 207, 160, 0.13);
      }
    }

    .modal > *:not(.bg-year-2027) {
      position: relative;
      z-index: 2;
    }

    @keyframes giftPop {
      0% {
        opacity: 0;
        transform: scale(0.86) translateY(14px) rotate(-1.5deg);
      }
      55% {
        transform: scale(1.02) translateY(-2px) rotate(0.8deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0) rotate(0deg);
      }
    }

    .close-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      font-size: 1.1rem;
      cursor: pointer;
      z-index: 6 !important;
    }

    .modal-date {
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 4px;
    }

    .modal-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.88rem;
      font-weight: 600;
      line-height: 1.15;
      margin-bottom: 14px;
      padding-right: 32px;
    }

    .modal-text {
      font-size: 0.99rem;
      line-height: 1.75;
      color: var(--text-main);
      margin-bottom: 18px;
      white-space: pre-line;
    }

    .modal.jan1-mode .modal-text {
      font-size: 1.06rem;
    }

    .audio-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 196, 210, 0.18);
      border-radius: 16px;
      padding: 12px 14px;
    }

    .audio-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    audio {
      width: 100%;
      height: 38px;
    }

    /* Floating hearts from gift box */
    .heart-burst-layer {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 150;
      overflow: hidden;
    }

    .floating-heart {
      position: absolute;
      font-size: 1.25rem;
      opacity: 0;
      animation: floatUpHeart 1.65s ease-out forwards;
    }

    .floating-heart.romantic-big {
      font-size: 1.75rem;
      animation: floatUpRomantic 2.6s ease-out forwards;
    }

    @keyframes floatUpHeart {
      0% {
        opacity: 0;
        transform: translate(0, 0) scale(0.45) rotate(0deg);
      }
      18% {
        opacity: 1;
        transform: translate(calc(var(--dx) * 0.25), -24px) scale(1.12) rotate(var(--rot));
      }
      100% {
        opacity: 0;
        transform: translate(var(--dx), -150px) scale(0.85) rotate(calc(var(--rot) * 1.6));
      }
    }

    @keyframes floatUpRomantic {
      0% {
        opacity: 0;
        transform: translate(0, 20px) scale(0.4) rotate(0deg);
      }
      16% {
        opacity: 1;
        transform: translate(calc(var(--dx) * 0.25), -35px) scale(1.2) rotate(var(--rot));
      }
      70% {
        opacity: 0.9;
      }
      100% {
        opacity: 0;
        transform: translate(var(--dx), -240px) scale(0.95) rotate(calc(var(--rot) * 1.8));
      }
    }
  </style>
</head>
<body>
  <div class="heart-burst-layer" id="heartLayer"></div>

  <div class="container">
    <header>
      <div class="eyebrow">24 NOYABR — 31 DEKABR</div>
      <h1>Hər Gün Sənə Doğru ✨</h1>
      <p class="subtitle">Bəzi şeylər sözə ehtiyac duymur, bəziləri isə bircə cümlə ilə yerinə düşür. Hər günə bir pay.</p>
      <div class="status-bar">
        <div class="pill">Açılan: <strong id="openedCount">0</strong> / <strong id="totalCount">38</strong></div>
        <div class="pill" id="todayInfo">Bu gün: —</div>
      </div>
    </header>

    <main class="grid" id="calendarGrid"></main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true">
    <div class="modal" id="modalBox">
      <div class="bg-year-2027" aria-hidden="true">2027</div>
      <button class="close-btn" id="closeModal" aria-label="Bağla">×</button>
      <div class="modal-date" id="modalDate"></div>
      <h2 class="modal-title" id="modalTitle"></h2>
      <p class="modal-text" id="modalText"></p>
      <div class="audio-box" id="audioBox" style="display: none;">
        <div class="audio-label" id="audioLabel">Bu günün fon musiqisi 🎶</div>
        <audio id="audioPlayer" controls preload="metadata"></audio>
      </div>
    </div>
  </div>

  <script>

      { id: "nov-24", day: 24, month: "Noyabr", year: 2026, title: "İlk qutu açıldı 🤍", song: DEFAULT_SONG,

      { id: "nov-25", day: 25, month: "Noyabr", year: 2026, title: "Sakit not", song: null,

      { id: "nov-27", day: 27, month: "Noyabr", year: 2026, title: "Axşamüstü", song: "song1.mp3",

      { id: "nov-28", day: 28, month: "Noyabr", year: 2026, title: "Kiçik sual 🤔", song: DEFAULT_SONG,

      { id: "nov-29", day: 29, month: "Noyabr", year: 2026, title: "Təbii hal", song: null,

      { id: "nov-30", day: 30, month: "Noyabr", year: 2026, title: "Noyabrın sonu", song: DEFAULT_SONG,

      { id: "dec-1", day: 1, month: "Dekabr", year: 2026, title: "Dekabr gəldi ✨", song: DEFAULT_SONG,

      { id: "dec-2", day: 2, month: "Dekabr", year: 2026, title: "Bir az zarafat 😌", song: null,

      { id: "dec-4", day: 4, month: "Dekabr", year: 2026, title: "Dərin nəfəs", song: null,

      { id: "dec-5", day: 5, month: "Dekabr", year: 2026, title: "Soyuq hava 🧣", song: DEFAULT_SONG,

      { id: "dec-11", day: 11, month: "Dekabr", year: 2026, title: "Özünə inan", song: DEFAULT_SONG,

      { id: "dec-13", day: 13, month: "Dekabr", year: 2026, title: "13 rəqəmi 🍀", song: DEFAULT_SONG,

      { id: "dec-28", day: 28, month: "Dekabr", year: 2026, title: "Geri sayım", song: null,
        text: "İlin son günləridir. Hər günün kiçik bir dadını çıxarmağa çalış." },
      { id: "dec-29", day: 29, month: "Dekabr", year: 2026, title: "Son 2 gün", song: DEFAULT_SONG,
        text: "Bu il sənə nə verdi, nəyi öyrətdi — bircə dəqiqə düşün, yaxşılarını yadda saxla." },
      { id: "dec-30", day: 30, month: "Dekabr", year: 2026, title: "Sabaha qədər", song: null,
        text: "38 günün sonuna cəmi bir gün qaldı. Sabah yekunlaşdırırıq." },
      { id: "dec-31", day: 31, month: "Dekabr", year: 2026, title: "Yeni ilin mübarək! 🥂", song: DEFAULT_SONG,
        text: "38 gün belə bitdi. Yeni il sənə can sağlığı, bol-bol rahatlıq, gülməli anlar və ürəyindən keçən hər şeyin ən yaxşısını gətirsin! ✨" }
    ];

    const SECRET_JAN_1 = {
      id: "jan-1-2027",
      day: 1,
      month: "Yanvar",
      year: 2027,
      isSecretJan1: true,
      title: "2027 — Səninlə 🤍",
      song: DEFAULT_SONG,
      text: "Hərkəs yeni ilə, sən illərimə.\n\nBu vaxta qədər özümü saxladığım nə varsa, bax burda açılır: sən mənim üçün sadəcə bir günün, bir ayın ya da bir ilin adamı deyilsən. Yeni il xoş gəlsin, amma ən gözəli sənin olduğun hər gün olsun."
    };

    const STORAGE_KEY = "advent_38_opened_v4";
    const gridEl = document.getElementById("calendarGrid");
    const openedCountEl = document.getElementById("openedCount");
    const totalCountEl = document.getElementById("totalCount");
    const todayInfoEl = document.getElementById("todayInfo");
    const modalBackdrop = document.getElementById("modalBackdrop");
    const modalBox = document.getElementById("modalBox");
    const closeModalBtn = document.getElementById("closeModal");
    const modalDateEl = document.getElementById("modalDate");
    const modalTitleEl = document.getElementById("modalTitle");
    const modalTextEl = document.getElementById("modalText");
    const audioBoxEl = document.getElementById("audioBox");
    const audioPlayerEl = document.getElementById("audioPlayer");
    const heartLayerEl = document.getElementById("heartLayer");

    function getOpenedSet() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return new Set(raw ? JSON.parse(raw) : []);
      } catch {
        return new Set();
      }
    }

    function saveOpenedSet(set) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...set]));
      } catch {}
    }

    function getEntryDate(entry) {
      const monthIdx = entry.month === "Noyabr" ? 10 : (entry.month === "Dekabr" ? 11 : 0);
      return new Date(entry.year, monthIdx, entry.day, 0, 0, 0, 0);
    }

    function getTodayStart() {
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0);
    }

    function isUnlocked(entry, todayStart) {
      if (entry.isSecretJan1) {
        return getOpenedSet().has("dec-31") && getEntryDate(entry) <= todayStart;
      }
      return getEntryDate(entry) <= todayStart;
    }

    function isToday(entry, todayStart) {
      return getEntryDate(entry).getTime() === todayStart.getTime();
    }

    function spawnHearts(isRomanticFinal = false) {
      const hearts = isRomanticFinal
        ? ["🤍", "❤️", "💖", "✨", "💕", "💗"]
        : ["🤍", "♥", "✨", "💕"];
      const count = isRomanticFinal ? 26 : 11;

      for (let i = 0; i < count; i++) {
        const el = document.createElement("span");
        el.className = isRomanticFinal ? "floating-heart romantic-big" : "floating-heart";
        el.textContent = hearts[i % hearts.length];
        const left = 14 + Math.random() * 72;
        const top = 42 + Math.random() * 34;
        const dx = (Math.random() - 0.5) * (isRomanticFinal ? 240 : 150);
        const rot = (Math.random() - 0.5) * 48;
        el.style.left = `${left}%`;
        el.style.top = `${top}%`;
        el.style.setProperty("--dx", `${dx}px`);
        el.style.setProperty("--rot", `${rot}deg`);
        el.style.animationDelay = `${i * (isRomanticFinal ? 0.06 : 0.05)}s`;
        heartLayerEl.appendChild(el);
        setTimeout(() => el.remove(), isRomanticFinal ? 2800 : 1700);
      }
    }

    let romanticLoopTimer = null;

    function startRomanticShower() {
      stopRomanticShower();
      spawnHearts(true);
      romanticLoopTimer = setInterval(() => {
        if (!modalBackdrop.classList.contains("active") || !modalBox.classList.contains("jan1-mode")) {
          stopRomanticShower();
          return;
        }
        spawnHearts(true);
      }, 1500);
    }

    function stopRomanticShower() {
      if (romanticLoopTimer) {
        clearInterval(romanticLoopTimer);
        romanticLoopTimer = null;
      }
    }

    function openEntry(entry, openedSet) {
      const isNewOpen = !openedSet.has(entry.id);
      openedSet.add(entry.id);
      saveOpenedSet(openedSet);

      modalDateEl.textContent = `${entry.day} ${entry.month} ${entry.year}`;
      modalTitleEl.textContent = entry.title;
      modalTextEl.textContent = entry.text;

      if (entry.isSecretJan1) {
        modalBox.classList.add("jan1-mode");
        startRomanticShower();
      } else {
        modalBox.classList.remove("jan1-mode");
        stopRomanticShower();
        spawnHearts(false);
      }

      if (entry.song) {
        audioBoxEl.style.display = "block";
        if (audioPlayerEl.getAttribute("src") !== entry.song) {
          audioPlayerEl.src = entry.song;
        }
        audioPlayerEl.currentTime = 0;
      } else {
        audioPlayerEl.pause();
        audioPlayerEl.removeAttribute("src");
        audioBoxEl.style.display = "none";
      }

      modalBox.classList.remove("gift-pop");
      void modalBox.offsetWidth;
      modalBox.classList.add("gift-pop");
      modalBackdrop.classList.add("active");

      if (isNewOpen || entry.id === "dec-31") {
        renderGrid();
      }
    }

    function closeModal() {
      stopRomanticShower();
      modalBox.classList.remove("jan1-mode");
      modalBackdrop.classList.remove("active");
      audioPlayerEl.pause();
      audioPlayerEl.currentTime = 0;
    }

    function renderGrid() {
      const openedSet = getOpenedSet();
      const todayStart = getTodayStart();
      gridEl.innerHTML = "";

      const now = new Date();
      const monthNames = ["Yanvar","Fevral","Mart","Aprel","May","İyun","İyul","Avqust","Sentyabr","Oktyabr","Noyabr","Dekabr"];
      todayInfoEl.textContent = `Bu gün: ${now.getDate()} ${monthNames[now.getMonth()]}`;

      const showSecretJan1 = openedSet.has("dec-31");
      const visibleEntries = showSecretJan1 ? [...ENTRIES, SECRET_JAN_1] : ENTRIES;
      totalCountEl.textContent = showSecretJan1 ? "39" : "38";

      let unlockedOpenedCount = 0;
      visibleEntries.forEach((entry) => {
        if (openedSet.has(entry.id) && isUnlocked(entry, todayStart)) {
          unlockedOpenedCount++;
        }
      });
      openedCountEl.textContent = unlockedOpenedCount;

      visibleEntries.forEach((entry) => {
        const unlocked = isUnlocked(entry, todayStart);
        const today = isToday(entry, todayStart);
        const opened = openedSet.has(entry.id) && unlocked;

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "day-card";
        if (!unlocked) btn.classList.add("locked");
        if (opened) btn.classList.add("opened");
        if (today) btn.classList.add("today");
        if (entry.isSecretJan1) btn.classList.add("secret-reveal");

        const icon = !unlocked ? "🔒" : (entry.isSecretJan1 ? "🥂" : (opened ? "🎁" : "🎀"));
        const badgeText = entry.isSecretJan1 ? "SÜRPRİZ" : (today ? "BU GÜN" : entry.month.slice(0, 3).toUpperCase());
        const statusText = !unlocked
          ? `${entry.day} ${entry.month}`
          : (entry.isSecretJan1 ? (opened ? "Açıldı 🤍" : "Gizli qutu") : (opened ? "Açılıb" : (today ? "Bu günün qutusu" : "Açılmayıb")));

        btn.innerHTML = `
          <div class="card-top">
            <span>${badgeText}</span>
            <span class="gift-icon">${icon}</span>
          </div>
          <div>
            <div class="day-num">${entry.day}</div>
            <div class="day-month">${entry.month} ${entry.isSecretJan1 ? "2027" : ""}</div>
          </div>
          <div class="card-footer">${statusText}</div>
        `;

        if (unlocked) {
          btn.addEventListener("click", () => openEntry(entry, openedSet));
        } else {
          btn.disabled = true;
        }

        gridEl.appendChild(btn);
      });
    }

    closeModalBtn.addEventListener("click", closeModal);
    modalBackdrop.addEventListener("click", (e) => {
      if (e.target === modalBackdrop) closeModal();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && modalBackdrop.classList.contains("active")) {
        closeModal();
      }
    });

    renderGrid();

    setInterval(() => {
      renderGrid();
    }, 30000);
  </script>
</body>
</html>
