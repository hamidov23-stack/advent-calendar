<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hər Gün Sənə Doğru 🕯️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Lora:ital,wght@0,400;0,500;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-velvet-1: #160910;
      --bg-velvet-2: #261019;
      --bg-velvet-3: #1a0c14;
      --paper-glass: rgba(255, 241, 236, 0.055);
      --paper-border: rgba(245, 206, 184, 0.2);
      --paper-open: linear-gradient(155deg, rgba(255, 224, 212, 0.16), rgba(212, 148, 128, 0.1));
      --paper-open-border: rgba(246, 204, 178, 0.5);
      --cream-text: #fdf3ee;
      --soft-blush: rgba(246, 224, 216, 0.74);
      --rose-gold: #f4bca8;
      --warm-gold: #f7d6a3;
      --wax-red: #8e2842;
      --letter-sheet: #1e0f17;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--cream-text);
      background:
        radial-gradient(ellipse at 15% 12%, rgba(232, 138, 120, 0.2), transparent 46%),
        radial-gradient(ellipse at 85% 22%, rgba(182, 72, 108, 0.24), transparent 48%),
        radial-gradient(ellipse at 50% 92%, rgba(247, 214, 163, 0.14), transparent 52%),
        linear-gradient(165deg, var(--bg-velvet-1) 0%, var(--bg-velvet-2) 52%, var(--bg-velvet-3) 100%);
      padding: 36px 18px 80px;
      overflow-x: hidden;
      position: relative;
    }

    /* Warm Candlelight Ambient Glow */
    body::before {
      content: "";
      position: fixed;
      inset: -15%;
      background:
        radial-gradient(circle at 28% 24%, rgba(247, 214, 163, 0.09), transparent 38%),
        radial-gradient(circle at 74% 68%, rgba(226, 120, 145, 0.09), transparent 42%);
      animation: candleBreath 11s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes candleBreath {
      0% {
        transform: scale(0.98) translate(-1%, -1%);
        opacity: 0.85;
      }
      100% {
        transform: scale(1.05) translate(1.5%, 1.5%);
        opacity: 1;
      }
    }

    /* Floating Golden Embers & Petals */
    .ambient-sky {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .ember-dot {
      position: absolute;
      bottom: -15px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff3dc 0%, #f4bca8 55%, transparent 100%);
      box-shadow: 0 0 10px rgba(247, 214, 163, 0.7);
      animation: emberRise linear infinite;
    }

    @keyframes emberRise {
      0% {
        transform: translateY(0) translateX(0) scale(0.6);
        opacity: 0;
      }
      18% {
        opacity: var(--ember-op, 0.75);
      }
      85% {
        opacity: var(--ember-op, 0.75);
      }
      100% {
        transform: translateY(-106vh) translateX(var(--drift, 40px)) scale(1.1);
        opacity: 0;
      }
    }

    .container {
      position: relative;
      z-index: 3;
      max-width: 1020px;
      margin: 0 auto;
    }

    /* Editorial Love-Letter Header */
    .letter-header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 26px;
      margin-bottom: 30px;
      border-bottom: 1px solid rgba(247, 214, 163, 0.2);
      animation: fadeSlideDown 0.85s ease-out;
    }

    @keyframes fadeSlideDown {
      0% {
        opacity: 0;
        transform: translateY(-10px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header-left {
      max-width: 600px;
    }

    .date-ribbon {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Lora', Georgia, serif;
      font-style: italic;
      font-size: 0.86rem;
      color: var(--warm-gold);
      margin-bottom: 8px;
    }

    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(2.5rem, 5.6vw, 3.8rem);
      font-weight: 600;
      font-style: italic;
      line-height: 1.05;
      margin-bottom: 10px;
      background: linear-gradient(125deg, #fffaf6 18%, #f8cbb8 58%, #f7d6a3 95%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-family: 'Lora', Georgia, serif;
      font-size: 0.96rem;
      line-height: 1.7;
      color: var(--soft-blush);
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    @media (max-width: 720px) {
      .header-right {
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
      }
    }

    .status-tag {
      background: rgba(255, 240, 232, 0.06);
      border: 1px solid rgba(247, 214, 163, 0.24);
      padding: 8px 16px;
      border-radius: 14px;
      font-size: 0.82rem;
      color: var(--soft-blush);
      backdrop-filter: blur(10px);
    }

    .status-tag strong {
      color: var(--warm-gold);
      font-weight: 600;
    }

    /* Envelope-Style Cards Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 15px;
    }

    @media (max-width: 480px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
    }

    .day-card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 138px;
      padding: 15px 15px 14px;
      border-radius: 18px;
      border: 1px solid var(--paper-border);
      background: var(--paper-glass);
      color: var(--cream-text);
      text-align: left;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
      backdrop-filter: blur(12px);
      overflow: hidden;
    }

    /* Envelope Flap Geometry */
    .day-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 46px;
      background: linear-gradient(180deg, rgba(247, 214, 163, 0.11), transparent);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .day-card:hover:not(.locked) {
      transform: translateY(-5px);
      border-color: rgba(247, 214, 163, 0.62);
      box-shadow: 0 16px 34px rgba(212, 102, 128, 0.22), inset 0 0 20px rgba(247, 214, 163, 0.08);
    }

    .day-card.opened {
      background: var(--paper-open);
      border-color: var(--paper-open-border);
    }

    .day-card.today:not(.locked) {
      border-color: rgba(247, 214, 163, 0.82);
      animation: todayCandleGlow 3.4s ease-in-out infinite;
    }

    @keyframes todayCandleGlow {
      0%, 100% {
        box-shadow: 0 0 0 1px rgba(247, 214, 163, 0.4), 0 10px 26px rgba(220, 110, 130, 0.22);
      }
      50% {
        box-shadow: 0 0 0 2px rgba(244, 188, 168, 0.65), 0 16px 38px rgba(235, 135, 145, 0.38);
      }
    }

    .day-card.locked {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .day-card.secret-reveal {
      background: linear-gradient(145deg, rgba(244, 175, 168, 0.26), rgba(247, 214, 163, 0.22));
      border-color: rgba(247, 214, 163, 0.75);
      box-shadow: 0 0 34px rgba(244, 165, 160, 0.32);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      color: var(--soft-blush);
      z-index: 1;
    }

    .day-card.today:not(.locked) .card-top span:first-child {
      color: var(--warm-gold);
      font-weight: 600;
    }

    /* Wax Seal Badge */
    .wax-seal {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      background: radial-gradient(circle at 32% 30%, #b63d5b, #6f1a30);
      border: 1px solid rgba(247, 214, 163, 0.45);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.38);
      transition: transform 0.25s ease;
    }

    .day-card.locked .wax-seal {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.14);
      box-shadow: none;
    }

    .day-card.opened .wax-seal {
      background: radial-gradient(circle at 32% 30%, #e59a84, #9e4b46);
    }

    .day-card:hover:not(.locked) .wax-seal {
      transform: scale(1.14) rotate(8deg);
    }

    .card-center {
      margin-top: 8px;
      z-index: 1;
    }

    .day-num {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2.05rem;
      font-weight: 600;
      line-height: 1;
      color: #fff9f5;
    }

    .day-month {
      font-family: 'Lora', Georgia, serif;
      font-style: italic;
      font-size: 0.82rem;
      color: var(--rose-gold);
      margin-top: 2px;
    }

    .card-footer {
      font-size: 0.73rem;
      color: var(--soft-blush);
      margin-top: 10px;
      padding-top: 7px;
      border-top: 1px dashed rgba(247, 214, 163, 0.16);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      z-index: 1;
    }

    .day-card.opened .card-footer {
      color: var(--warm-gold);
    }

    /* Poetic Letter Sheet Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(12, 5, 9, 0.82);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal {
      position: relative;
      width: 100%;
      max-width: 500px;
      background:
        radial-gradient(circle at top left, rgba(247, 214, 163, 0.13), transparent 48%),
        radial-gradient(circle at bottom right, rgba(214, 96, 128, 0.14), transparent 52%),
        var(--letter-sheet);
      border: 1px solid rgba(247, 214, 163, 0.34);
      border-radius: 24px;
      padding: 32px 28px 28px;
      box-shadow: 0 30px 75px rgba(0, 0, 0, 0.72), inset 0 0 0 6px rgba(247, 214, 163, 0.04);
      overflow: hidden;
    }

    .modal.gift-pop {
      animation: letterUnfold 0.55s cubic-bezier(0.22, 1.2, 0.36, 1);
    }

    @keyframes letterUnfold {
      0% {
        opacity: 0;
        transform: scale(0.88) translateY(18px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .modal.jan1-mode {
      background: linear-gradient(155deg, #2d111e, #1a0b14 55%, #2b1817);
      border-color: rgba(247, 214, 163, 0.65);
      box-shadow: 0 30px 85px rgba(235, 130, 145, 0.35);
    }

    .bg-year-2027 {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: clamp(5.5rem, 22vw, 8.8rem);
      font-weight: 600;
      color: rgba(247, 214, 163, 0.09);
      user-select: none;
      pointer-events: none;
      z-index: 0;
    }

    .modal.jan1-mode .bg-year-2027 {
      display: flex;
    }

    .modal > *:not(.bg-year-2027) {
      position: relative;
      z-index: 2;
    }

    .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(247, 214, 163, 0.24);
      background: rgba(255, 255, 255, 0.05);
      color: var(--cream-text);
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
      z-index: 6 !important;
    }

    .close-btn:hover {
      background: rgba(244, 188, 168, 0.2);
      transform: rotate(90deg);
    }

    .modal-date {
      font-family: 'Lora', Georgia, serif;
      font-style: italic;
      font-size: 0.85rem;
      color: var(--warm-gold);
      margin-bottom: 6px;
    }

    .modal-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2.15rem;
      font-weight: 600;
      font-style: italic;
      line-height: 1.12;
      margin-bottom: 16px;
      padding-right: 34px;
      color: #fff8f4;
    }

    .modal-text {
      font-family: 'Lora', Georgia, serif;
      font-size: 1.02rem;
      line-height: 1.84;
      color: rgba(253, 243, 238, 0.95);
      margin-bottom: 18px;
      white-space: pre-line;
      padding-left: 14px;
      border-left: 2px solid rgba(247, 214, 163, 0.35);
    }

    .modal.jan1-mode .modal-text {
      font-size: 1.08rem;
    }

    /* Two-choice romantic note (Nov 28) */
    .choice-box {
      display: none;
      margin-bottom: 18px;
    }

    .choice-box.active {
      display: block;
    }

    .choice-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    @media (max-width: 420px) {
      .choice-buttons {
        grid-template-columns: 1fr;
      }
    }

    .choice-btn {
      padding: 11px 14px;
      border-radius: 14px;
      border: 1px solid rgba(247, 214, 163, 0.28);
      background: rgba(255, 240, 232, 0.05);
      color: var(--cream-text);
      font-family: 'Lora', Georgia, serif;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.22s ease;
    }

    .choice-btn:hover {
      border-color: var(--warm-gold);
      background: rgba(244, 188, 168, 0.14);
      transform: translateY(-2px);
    }

    .choice-btn.selected {
      background: linear-gradient(135deg, rgba(244, 188, 168, 0.26), rgba(247, 214, 163, 0.2));
      border-color: var(--warm-gold);
      color: #fff;
      box-shadow: 0 6px 20px rgba(220, 115, 130, 0.25);
    }

    .choice-reveal {
      min-height: 68px;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(247, 214, 163, 0.08);
      border: 1px dashed rgba(247, 214, 163, 0.4);
      font-family: 'Lora', Georgia, serif;
      font-style: italic;
      font-size: 0.98rem;
      line-height: 1.75;
      color: #fff6f1;
      animation: choiceFade 0.35s ease;
    }

    @keyframes choiceFade {
      0% {
        opacity: 0;
        transform: translateY(6px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .audio-box {
      background: rgba(255, 240, 232, 0.05);
      border: 1px solid rgba(247, 214, 163, 0.22);
      border-radius: 16px;
      padding: 12px 14px;
    }

    .audio-label {
      font-family: 'Lora', Georgia, serif;
      font-style: italic;
      font-size: 0.82rem;
      color: var(--rose-gold);
      margin-bottom: 8px;
    }

    audio {
      width: 100%;
      height: 38px;
    }

    /* Floating hearts */
    .heart-burst-layer {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 150;
      overflow: hidden;
    }

    .floating-heart {
      position: absolute;
      font-size: 1.3rem;
      opacity: 0;
      animation: floatUpHeart 1.75s ease-out forwards;
    }

    .floating-heart.romantic-big {
      font-size: 1.8rem;
      animation: floatUpRomantic 2.7s ease-out forwards;
    }

    @keyframes floatUpHeart {
      0% {
        opacity: 0;
        transform: translate(0, 0) scale(0.45) rotate(0deg);
      }
      18% {
        opacity: 1;
        transform: translate(calc(var(--dx) * 0.25), -26px) scale(1.15) rotate(var(--rot));
      }
      100% {
        opacity: 0;
        transform: translate(var(--dx), -160px) scale(0.85) rotate(calc(var(--rot) * 1.6));
      }
    }

    @keyframes floatUpRomantic {
      0% {
        opacity: 0;
        transform: translate(0, 20px) scale(0.4) rotate(0deg);
      }
      16% {
        opacity: 1;
        transform: translate(calc(var(--dx) * 0.25), -35px) scale(1.22) rotate(var(--rot));
      }
      70% {
        opacity: 0.92;
      }
      100% {
        opacity: 0;
        transform: translate(var(--dx), -250px) scale(0.95) rotate(calc(var(--rot) * 1.8));
      }
    }
  </style>
</head>
<body>
  <div class="ambient-sky" id="ambientSky" aria-hidden="true"></div>
  <div class="heart-burst-layer" id="heartLayer"></div>

  <div class="container">
    <header class="letter-header">
      <div class="header-left">
        <div class="date-ribbon">🕯️ 24 Noyabr — 31 Dekabr · Sənə yazılmış 38 kiçik məktub</div>
        <h1>Hər Gün Sənə Doğru</h1>
        <p class="subtitle">Bəzi hisslər səs-küy sevmir — sadəcə hər gün açılan bir zərfin içində sakitcə səni gözləyir.</p>
      </div>
      <div class="header-right">
        <div class="status-tag">Oxunan məktublar: <strong id="openedCount">0</strong> / <strong id="totalCount">38</strong></div>
        <div class="status-tag" id="todayInfo">Bu gün: —</div>
      </div>
    </header>

    <main class="grid" id="calendarGrid"></main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true">
    <div class="modal" id="modalBox">
      <div class="bg-year-2027" aria-hidden="true">2027</div>
      <button class="close-btn" id="closeModal" aria-label="Bağla">×</button>
      <div class="modal-date" id="modalDate"></div>
      <h2 class="modal-title" id="modalTitle"></h2>
      <p class="modal-text" id="modalText"></p>

      <div class="choice-box" id="choiceBox">
        <div class="choice-buttons">
          <button type="button" class="choice-btn" id="choiceSecretBtn">💌 Sənə bir sirr</button>
          <button type="button" class="choice-btn" id="choiceEveningBtn">🌙 Bu axşamlıq bir söz</button>
        </div>
        <div class="choice-reveal" id="choiceReveal" style="display: none;"></div>
      </div>

      <div class="audio-box" id="audioBox" style="display: none;">
        <div class="audio-label" id="audioLabel">Məktubun fon musiqisi 🎶</div>
        <audio id="audioPlayer" controls preload="metadata"></audio>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_SONG = "song.mp3";

    const ENTRIES = [
      { id: "nov-24", day: 24, month: "Noyabr", year: 2026, title: "İlk qutu açıldı 🤍", song: DEFAULT_SONG,
        text: "Hə, bax başlandı. Heç nəyi böyütmürəm, sadəcə 38 gün hər gün bura kiçik bir şey qoyacam. Ümid edirəm açanda üzündə balaca da olsa bir gülüş olar." },
      { id: "nov-25", day: 25, month: "Noyabr", year: 2026, title: "Sakit not", song: null,
        text: "Bu gün mahnı qoymadım. Bəzən səs olmayanda sözlər daha yaxşı eşidilir. Özündən muğayat ol, soyuqda çox qalma." },
      { id: "nov-26", day: 26, month: "Noyabr", year: 2026, title: "Kofe bəhanəsi ☕", song: DEFAULT_SONG,
        text: "Hava soyuqlaşanda kofe içməyin həmişə bir bəhanəsi tapılır. Bunu say kiçik kupon kimi: istədiyin vaxt bir kofe borcum olsun." },
      { id: "nov-27", day: 27, month: "Noyabr", year: 2026, title: "Axşamüstü", song: "song1.mp3",
        text: "Gün boyu o qədər boş-boş iş olur ki, axşam iki kəlmə normal danışmaq adamı xeyli yüngülləşdirir." },
      { id: "nov-28", day: 28, month: "Noyabr", year: 2026, title: "İki seçim 🤍", song: "song2.mp3",
        isTwoChoice: true,
        text: "Bu gün adi cümlə qoymadım. İkisindən birini seç — hərəsinin altında balaca bir şey gizlənib.",
        secretText: "Bəzən gün ərzində ağlıma gələn ilk şey sənsən, amma bunu heç vaxt səs-küylə demirəm — elə belə qalması daha xoşuma gəlir.",
        eveningText: "Soyuq havada səninlə danışmaq adamın içindəki o narahatlığı sakitləşdirir. Yaxşı ki varsan 🤍" },
      { id: "nov-29", day: 29, month: "Noyabr", year: 2026, title: "Təbii hal", song: null,
        text: "Səndə ən xoşuma gələn şey o rahat, özün kimi olmağındır. Heç nəyi oynamırmış kimi görünürsən, o da adama yaxşı təsir edir." },
      { id: "nov-30", day: 30, month: "Noyabr", year: 2026, title: "Noyabrın sonu", song: DEFAULT_SONG,
        text: "Noyabr da belə getdi. Sabahdan dekabr başlayır — ilin ən səs-küylü, bir az da şirin ayı." },

      { id: "dec-1", day: 1, month: "Dekabr", year: 2026, title: "Dekabr gəldi ✨", song: DEFAULT_SONG,

        text: "38 günün sonuna cəmi bir gün qaldı. Sabah yekunlaşdırırıq." },
      { id: "dec-31", day: 31, month: "Dekabr", year: 2026, title: "Yeni ilin mübarək! 🥂", song: DEFAULT_SONG,
        text: "38 gün belə bitdi. Yeni il sənə can sağlığı, bol-bol rahatlıq, gülməli anlar və ürəyindən keçən hər şeyin ən yaxşısını gətirsin! ✨" }
    ];

    const SECRET_JAN_1 = {
      id: "jan-1-2027",
      day: 1,
      month: "Yanvar",
      year: 2027,
      isSecretJan1: true,
      title: "2027 — Səninlə 🤍",
      song: DEFAULT_SONG,
      text: "Hərkəs yeni ilə, sən illərimə.\n\nBu vaxta qədər özümü saxladığım nə varsa, bax burda açılır: sən mənim üçün sadəcə bir günün, bir ayın ya da bir ilin adamı deyilsən. Yeni il xoş gəlsin, amma ən gözəli sənin olduğun hər gün olsun."
    };

    const STORAGE_KEY = "advent_38_opened_v4";
    const ambientSkyEl = document.getElementById("ambientSky");
    const gridEl = document.getElementById("calendarGrid");
    const openedCountEl = document.getElementById("openedCount");
    const totalCountEl = document.getElementById("totalCount");
    const todayInfoEl = document.getElementById("todayInfo");
    const modalBackdrop = document.getElementById("modalBackdrop");
    const modalBox = document.getElementById("modalBox");
    const closeModalBtn = document.getElementById("closeModal");
    const modalDateEl = document.getElementById("modalDate");
    const modalTitleEl = document.getElementById("modalTitle");
    const modalTextEl = document.getElementById("modalText");
    const choiceBoxEl = document.getElementById("choiceBox");
    const choiceSecretBtn = document.getElementById("choiceSecretBtn");
    const choiceEveningBtn = document.getElementById("choiceEveningBtn");
    const choiceRevealEl = document.getElementById("choiceReveal");
    const audioBoxEl = document.getElementById("audioBox");
    const audioPlayerEl = document.getElementById("audioPlayer");
    const heartLayerEl = document.getElementById("heartLayer");

    let activeTwoChoiceEntry = null;

    function initCandleEmbers() {
      for (let i = 0; i < 32; i++) {
        const dot = document.createElement("span");
        dot.className = "ember-dot";
        const size = 2.5 + Math.random() * 4;
        const left = Math.random() * 100;
        const duration = 9 + Math.random() * 13;
        const delay = -Math.random() * 18;
        const drift = (Math.random() - 0.5) * 90;
        const op = 0.3 + Math.random() * 0.55;

        dot.style.width = `${size}px`;
        dot.style.height = `${size}px`;
        dot.style.left = `${left}%`;
        dot.style.animationDuration = `${duration}s`;
        dot.style.animationDelay = `${delay}s`;
        dot.style.setProperty("--drift", `${drift}px`);
        dot.style.setProperty("--ember-op", op.toFixed(2));
        ambientSkyEl.appendChild(dot);
      }
    }

    function getOpenedSet() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return new Set(raw ? JSON.parse(raw) : []);
      } catch {
        return new Set();
      }
    }

    function saveOpenedSet(set) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...set]));
      } catch {}
    }

    function getEntryDate(entry) {
      const monthIdx = entry.month === "Noyabr" ? 10 : (entry.month === "Dekabr" ? 11 : 0);
      return new Date(entry.year, monthIdx, entry.day, 0, 0, 0, 0);
    }

    function getTodayStart() {
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0);
    }

    function isUnlocked(entry, todayStart) {
      if (entry.isSecretJan1) {
        return getOpenedSet().has("dec-31") && getEntryDate(entry) <= todayStart;
      }
      return getEntryDate(entry) <= todayStart;
    }

    function isToday(entry, todayStart) {
      return getEntryDate(entry).getTime() === todayStart.getTime();
    }

    function spawnHearts(isRomanticFinal = false) {
      const hearts = isRomanticFinal
        ? ["🤍", "❤️", "💖", "✨", "💕", "🕯️"]
        : ["🤍", "♥", "✨", "🕯️"];
      const count = isRomanticFinal ? 28 : 12;

      for (let i = 0; i < count; i++) {
        const el = document.createElement("span");
        el.className = isRomanticFinal ? "floating-heart romantic-big" : "floating-heart";
        el.textContent = hearts[i % hearts.length];
        const left = 14 + Math.random() * 72;
        const top = 42 + Math.random() * 34;
        const dx = (Math.random() - 0.5) * (isRomanticFinal ? 240 : 150);
        const rot = (Math.random() - 0.5) * 48;
        el.style.left = `${left}%`;
        el.style.top = `${top}%`;
        el.style.setProperty("--dx", `${dx}px`);
        el.style.setProperty("--rot", `${rot}deg`);
        el.style.animationDelay = `${i * (isRomanticFinal ? 0.06 : 0.05)}s`;
        heartLayerEl.appendChild(el);
        setTimeout(() => el.remove(), isRomanticFinal ? 2800 : 1800);
      }
    }

    let romanticLoopTimer = null;

    function startRomanticShower() {
      stopRomanticShower();
      spawnHearts(true);
      romanticLoopTimer = setInterval(() => {
        if (!modalBackdrop.classList.contains("active") || !modalBox.classList.contains("jan1-mode")) {
          stopRomanticShower();
          return;
        }
        spawnHearts(true);
      }, 1500);
    }

    function stopRomanticShower() {
      if (romanticLoopTimer) {
        clearInterval(romanticLoopTimer);
        romanticLoopTimer = null;
      }
    }

    function applyChoiceSelection(type) {
      if (!activeTwoChoiceEntry) return;
      choiceSecretBtn.classList.toggle("selected", type === "secret");
      choiceEveningBtn.classList.toggle("selected", type === "evening");

      choiceRevealEl.style.display = "block";
      choiceRevealEl.style.animation = "none";
      void choiceRevealEl.offsetWidth;
      choiceRevealEl.style.animation = "choiceFade 0.35s ease";
      choiceRevealEl.textContent =
        type === "secret" ? activeTwoChoiceEntry.secretText : activeTwoChoiceEntry.eveningText;
      spawnHearts(false);
    }

    choiceSecretBtn.addEventListener("click", () => applyChoiceSelection("secret"));
    choiceEveningBtn.addEventListener("click", () => applyChoiceSelection("evening"));

    function openEntry(entry, openedSet) {
      const isNewOpen = !openedSet.has(entry.id);
      openedSet.add(entry.id);
      saveOpenedSet(openedSet);

      modalDateEl.textContent = `${entry.day} ${entry.month} ${entry.year}`;
      modalTitleEl.textContent = entry.title;
      modalTextEl.textContent = entry.text;

      if (entry.isTwoChoice) {
        activeTwoChoiceEntry = entry;
        choiceBoxEl.classList.add("active");
        choiceSecretBtn.classList.remove("selected");
        choiceEveningBtn.classList.remove("selected");
        choiceRevealEl.style.display = "none";
        choiceRevealEl.textContent = "";
      } else {
        activeTwoChoiceEntry = null;
        choiceBoxEl.classList.remove("active");
        choiceRevealEl.style.display = "none";
      }

      if (entry.isSecretJan1) {
        modalBox.classList.add("jan1-mode");
        startRomanticShower();
      } else {
        modalBox.classList.remove("jan1-mode");
        stopRomanticShower();
        spawnHearts(false);
      }

      if (entry.song) {
        audioBoxEl.style.display = "block";
        if (audioPlayerEl.getAttribute("src") !== entry.song) {
          audioPlayerEl.src = entry.song;
        }
        audioPlayerEl.currentTime = 0;
        audioPlayerEl.play().catch(() => {});
      } else {
        audioPlayerEl.pause();
        audioPlayerEl.removeAttribute("src");
        audioBoxEl.style.display = "none";
      }

      modalBox.classList.remove("gift-pop");
      void modalBox.offsetWidth;
      modalBox.classList.add("gift-pop");
      modalBackdrop.classList.add("active");

      if (isNewOpen || entry.id === "dec-31") {
        renderGrid();
      }
    }

    function closeModal() {
      stopRomanticShower();
      activeTwoChoiceEntry = null;
      choiceBoxEl.classList.remove("active");
      modalBox.classList.remove("jan1-mode");
      modalBackdrop.classList.remove("active");
      audioPlayerEl.pause();
      audioPlayerEl.currentTime = 0;
    }

    function renderGrid() {
      const openedSet = getOpenedSet();
      const todayStart = getTodayStart();
      gridEl.innerHTML = "";

      const now = new Date();
      const monthNames = ["Yanvar","Fevral","Mart","Aprel","May","İyun","İyul","Avqust","Sentyabr","Oktyabr","Noyabr","Dekabr"];
      todayInfoEl.textContent = `Bu gün: ${now.getDate()} ${monthNames[now.getMonth()]}`;

      const showSecretJan1 = openedSet.has("dec-31");
      const visibleEntries = showSecretJan1 ? [...ENTRIES, SECRET_JAN_1] : ENTRIES;
      totalCountEl.textContent = showSecretJan1 ? "39" : "38";

      let unlockedOpenedCount = 0;
      visibleEntries.forEach((entry) => {
        if (openedSet.has(entry.id) && isUnlocked(entry, todayStart)) {
          unlockedOpenedCount++;
        }
      });
      openedCountEl.textContent = unlockedOpenedCount;

      visibleEntries.forEach((entry) => {
        const unlocked = isUnlocked(entry, todayStart);
        const today = isToday(entry, todayStart);
        const opened = openedSet.has(entry.id) && unlocked;

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "day-card";
        if (!unlocked) btn.classList.add("locked");
        if (opened) btn.classList.add("opened");
        if (today) btn.classList.add("today");
        if (entry.isSecretJan1) btn.classList.add("secret-reveal");

        const icon = !unlocked ? "🔒" : (entry.isSecretJan1 ? "🥂" : (opened ? "🤍" : "✉️"));
        const badgeText = entry.isSecretJan1 ? "SÜRPRİZ" : (today ? "BU GÜN" : entry.month.slice(0, 3).toUpperCase());
        const statusText = !unlocked
          ? `${entry.day} ${entry.month}`
          : (entry.isSecretJan1 ? (opened ? "Açıldı 🤍" : "Gizli zərf") : (opened ? "Oxunub 🤍" : (today ? "Bugünkü məktub" : "Zərfi aç")));

        btn.innerHTML = `
          <div class="card-top">
            <span>${badgeText}</span>
            <span class="wax-seal">${icon}</span>
          </div>
          <div class="card-center">
            <div class="day-num">${entry.day}</div>
            <div class="day-month">${entry.month} ${entry.isSecretJan1 ? "2027" : ""}</div>
          </div>
          <div class="card-footer">${statusText}</div>
        `;

        if (unlocked) {
          btn.addEventListener("click", () => openEntry(entry, openedSet));
        } else {
          btn.disabled = true;
        }

        gridEl.appendChild(btn);
      });
    }

    closeModalBtn.addEventListener("click", closeModal);
    modalBackdrop.addEventListener("click", (e) => {
      if (e.target === modalBackdrop) closeModal();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && modalBackdrop.classList.contains("active")) {
        closeModal();
      }
    });

    initCandleEmbers();
    renderGrid();

    setInterval(() => {
      renderGrid();
    }, 30000);
  </script>
</body>
